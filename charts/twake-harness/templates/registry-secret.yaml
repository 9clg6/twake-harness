{{- if .Values.imagePullSecret.create }}
# Pulls the image from the private registry; the chart lists it in imagePullSecrets itself
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Release.Name }}-registry
  labels:
    {{- include "twake-harness.labels" . | nindent 4 }}
stringData:
  .dockerconfigjson: {{ dict "auths" (dict .Values.imagePullSecret.registry (dict "username" .Values.imagePullSecret.username "password" .Values.imagePullSecret.password "auth" (printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.password | b64enc))) | toJson | quote }}
{{- end }}
