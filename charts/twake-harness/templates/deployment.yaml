apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "twake-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # One writer of the volume at a time
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "twake-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twake-harness.labels" . | nindent 8 }}
      annotations:
        {{- if and .Values.secretEnv (not .Values.existingSecret) }}
        checksum/env: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if or .Values.imagePullSecrets .Values.imagePullSecret.create }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
        {{- if .Values.imagePullSecret.create }}
        - name: {{ .Release.Name }}-registry
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          image: {{ include "twake-harness.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HARNESS_ROLE
              value: {{ .Values.role | quote }}
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: AUTH_JWKS_URL
              value: {{ .Values.config.authJwksUrl | quote }}
            - name: AUTH_ISSUER
              value: {{ .Values.config.authIssuer | quote }}
            - name: AUTH_AUDIENCE
              value: {{ .Values.config.authAudience | quote }}
            - name: APISIX_BASE_URL
              value: {{ .Values.config.apisixBaseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.config.llmModel | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ORG_AGENT_ENABLED
              value: {{ .Values.config.orgAgentEnabled | quote }}
            - name: ORG_AGENT_LOCALPART
              value: {{ .Values.config.orgAgentLocalpart | quote }}
            - name: ORG_AGENT_NAME
              value: {{ .Values.config.orgAgentName | quote }}
            {{- with .Values.config.orgAgentPersona }}
            - name: ORG_AGENT_PERSONA
              value: {{ . | quote }}
            {{- end }}
            - name: ORG_AGENT_MEMBERS
              value: {{ .Values.config.orgAgentMembers | quote }}
            - name: EVENTS_CLIENT_IDS
              value: {{ .Values.config.eventsClientIds | quote }}
            {{- if eq .Values.role "matrix" }}
            - name: MATRIX_SERVER_NAME
              value: {{ .Values.config.matrixServerName | quote }}
            - name: MATRIX_APPSERVICE_ID
              value: {{ .Values.config.matrixAppserviceId | quote }}
            - name: MATRIX_SENDER_LOCALPART
              value: {{ .Values.config.matrixSenderLocalpart | quote }}
            - name: MATRIX_ASSISTANT_PREFIX
              value: {{ .Values.config.matrixAssistantPrefix | quote }}
            - name: MATRIX_CRYPTO_STORE_PATH
              value: {{ printf "%s/crypto" .Values.persistence.mountPath | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "twake-harness.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
      {{- end }}
