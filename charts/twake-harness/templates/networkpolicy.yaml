{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "twake-harness.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "twake-harness.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Only the gateway reaches the harness, and the harness only reaches the gateway and its database,
  # and the broker for the worker role that listens to it
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apisixNamespace }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apisixNamespace }}
    {{- with .Values.networkPolicy.databaseCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $.Values.networkPolicy.databasePort }}
          protocol: TCP
    {{- end }}
    {{- if and (eq .Values.role "worker") (or .Values.config.activityEnabled .Values.config.calendarEnabled) .Values.networkPolicy.rabbitmqNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.rabbitmqNamespace }}
      ports:
        - port: {{ .Values.networkPolicy.rabbitmqPort }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
